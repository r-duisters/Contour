apply plugin: 'com.android.application'

/**
 * Which of the two apps this build is.
 *
 * They are genuinely different applications, not two configurations of one:
 * the standalone build keeps its own database on the device and has no server,
 * no alerts and no login, while the wrapper is a WebView onto a running
 * Contour instance. Installing one over the other would replace it and leave
 * the phone with an empty portfolio, so they carry different application ids
 * and sit side by side instead.
 *
 * CONTOUR_URL is the same switch capacitor.config.ts reads, so one variable
 * decides both the bundle and the identity. Setting it builds the wrapper.
 *
 * `namespace` deliberately stays put: it is the Java package, and moving it
 * would mean moving MainActivity on disk for no gain. Android identifies an
 * installed app by its applicationId, which is what differs here.
 */
def contourUrl = System.getenv("CONTOUR_URL")
def isWrapper = contourUrl != null && !contourUrl.trim().isEmpty()
def contourAppId = isWrapper ? "app.contour.local" : "app.contour.standalone"
/*
 * The device build is Contour. The wrapper is the one that needs a qualifier
 * now, which is the right way round: it exists to compare against, and the app
 * a person installs is this one.
 *
 * The *ids* deliberately do not move with the names. `app.contour.standalone`
 * is what Android identifies the installed app by, so changing it would not
 * rename anything — it would install a second app beside the first and leave
 * the portfolio in the database of the one nobody opens any more. A rename is
 * a label; an id is an identity.
 */
def contourAppName = isWrapper ? "Contour LAN" : "Contour"

/**
 * Minutes since 2026-01-01T00:00Z, as an int.
 *
 * `intdiv` rather than `/`: Groovy's division on longs yields a BigDecimal,
 * which `versionCode` rejects with "Value is null". And a local rather than an
 * expression at the call site: `versionCode (x) as int` parses as
 * `versionCode(x)` — a call that returns null — and then casts that.
 */
def contourBuildNumber = (System.currentTimeMillis().intdiv(60000L) - 29453760L).intValue()

android {
    namespace = "app.contour.local"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId contourAppId
        // Generated here rather than in strings.xml so both builds cannot
        // claim the same name in the launcher, the recents card (MainActivity
        // reads title_activity_main) or a deep link.
        resValue "string", "app_name", contourAppName
        resValue "string", "title_activity_main", contourAppName
        resValue "string", "package_name", contourAppId
        resValue "string", "custom_url_scheme", contourAppId
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // Minutes since 2026-01-01T00:00Z, computed in `contourBuildNumber`
        // just above the `android` block.
        //
        // This was a literal 1 and had been since the project was generated.
        // Samsung's launcher keys its icon cache on package plus versionCode,
        // so every build ever installed looked like the same version to it and
        // the cache was never invalidated: the home screen kept drawing an icon
        // from an early build through a dozen reinstalls, while the app-open
        // animation — which reads the icon fresh — drew the current one. The
        // two disagreed on screen and neither was wrong.
        //
        // Monotonic, with four millennia of int left. It makes a build
        // non-reproducible in this one field, which is the point: a rebuild a
        // launcher cannot tell apart is exactly the failure above.
        versionCode contourBuildNumber
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
		dirs '../../node_modules/@capacitor/background-runner/android/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
