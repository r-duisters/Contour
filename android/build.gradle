// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'

        /*
         * No `com.google.gms:google-services` here, and that is a decision.
         *
         * Capacitor's template puts it on the classpath so Firebase works if
         * you add it. This app has no Firebase: push needs Google, a server to
         * push from, and an account, which the project's direction rules out —
         * device alerts are evaluated locally and posted by Android itself.
         *
         * A classpath entry is fetched whether or not the plugin is applied, so
         * leaving it meant every build pulled a proprietary artifact from
         * Google's Maven for a feature that does not exist. F-Droid builds only
         * from free dependencies, and this was the one thing in the tree that
         * was not.
         *
         * NOTE: Do not place your application dependencies here; they belong
         * in the individual module build.gradle files
         */
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
