# Contour's web app.
#
#   cp .env.example .env      # fill in the secrets it names
#   docker compose up -d
#   open http://localhost:3000 → you are sent to /setup to choose a password
#
# The alert scheduler is a separate file, `docker-compose.alerts.yml`, and stays
# separate on purpose: the process holding a year of transactions should not be
# restarted to change a timer.
services:
  contour:
    build:
      context: .
      dockerfile: docker/web/Dockerfile
    image: contour:local
    container_name: contour
    restart: unless-stopped
    ports:
      - "${CONTOUR_PORT:-3000}:3000"
    environment:
      # Signs the session cookie. Changing it logs you out; losing it costs
      # nothing else. `openssl rand -hex 32`
      SESSION_SECRET: "${SESSION_SECRET:?set SESSION_SECRET in .env — openssl rand -hex 32}"
      # Guards /api/cron/evaluate, which is the only route that acts without a
      # session. Required whether or not you run the scheduler.
      CRON_SECRET: "${CRON_SECRET:?set CRON_SECRET in .env — openssl rand -hex 32}"
      # Web Push, optional. Absent, the settings screen simply does not offer
      # notifications on this device. `npx web-push generate-vapid-keys`
      VAPID_PUBLIC_KEY: "${VAPID_PUBLIC_KEY:-}"
      VAPID_PRIVATE_KEY: "${VAPID_PRIVATE_KEY:-}"
      VAPID_SUBJECT: "${VAPID_SUBJECT:-mailto:you@example.com}"
    volumes:
      # Everything that must outlive the container. The image is disposable;
      # this is not.
      - contour-data:/data
      # Logos fetched once and kept, so a rebuild does not re-ask a CDN for
      # every icon. Losing it costs bandwidth, not data.
      - contour-icons:/app/.icon-cache
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

volumes:
  contour-data:
  contour-icons:
